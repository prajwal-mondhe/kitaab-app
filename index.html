<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITAAB — Brutalism mockup v2</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3EE;
    --line:#000000;
    --ink:#0D0C0A;
    --yellow:#F4C63D;
    --teal:#4BA88F;
    --coral:#E8654A;
    --lavender:#B9A6E8;
    --paper:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:20px 16px 60px 16px;}

  .tabs{display:flex; gap:0; margin-bottom:26px; border:4px solid var(--line);}
  .tab{
    flex:1; text-align:center; padding:10px;
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:12px; letter-spacing:0.05em;
    cursor:pointer;
  }
  .tab:first-child{border-right:4px solid var(--line);}
  .tab.active{background:var(--ink); color:#fff;}
  .view{display:none;}
  .view.active{display:block;}

  h1.brand{
    font-family:'Archivo Black', sans-serif; font-size:30px; text-transform:uppercase;
    margin:0 0 22px 0; letter-spacing:0.5px;
  }
  .section-label{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color:#fff; background:var(--ink);
    padding:4px 10px; margin:0 0 12px 0;
  }

  .recent-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px;}
  .tile{
    border:4px solid var(--line);
    box-shadow:6px 6px 0 var(--line);
    padding:12px 10px;
    transition:transform .08s, box-shadow .08s;
    cursor:pointer;
  }
  .tile:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--line);}
  .tile.c1{background:var(--yellow);}
  .tile.c2{background:var(--teal); color:#fff;}
  .tile.c3{background:var(--lavender);}
  .tile .t-notebook{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:9px; letter-spacing:0.05em; text-transform:uppercase;}
  .tile .t-title{font-family:'Archivo Black', sans-serif; font-size:14px; margin-top:8px; line-height:1.2; text-transform:uppercase;}
  .tile .t-meta{font-family:'IBM Plex Mono', monospace; font-size:9px; margin-top:12px; opacity:0.75;}

  .card{
    background:var(--paper);
    border:4px solid var(--line);
    box-shadow:6px 6px 0 var(--line);
    padding:16px;
    margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    transition:transform .08s, box-shadow .08s;
    cursor:pointer;
  }
  .card:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--line);}
  .card-title{font-family:'Archivo Black', sans-serif; font-size:19px; margin:0; text-transform:uppercase;}
  .card-meta{font-family:'IBM Plex Mono', monospace; font-size:11px; margin-top:8px; color:#4A463F;}
  .badge{
    background:var(--coral); border:3px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700; padding:5px 9px; color:#fff;
    flex-shrink:0; text-transform:uppercase;
  }

  .fab{
    margin-top:4px; display:inline-block;
    background:var(--ink); color:#fff;
    border:4px solid var(--line); box-shadow:6px 6px 0 var(--coral);
    font-family:'Archivo Black', sans-serif; font-size:13px; text-transform:uppercase;
    padding:14px 22px; cursor:pointer;
    transition:transform .08s, box-shadow .08s;
  }
  .fab:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--coral);}

  /* Note screen */
  .note-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .note-title{font-family:'Archivo Black', sans-serif; font-size:22px; text-transform:uppercase;}
  .icon-row{display:flex; gap:8px;}
  .icon-box{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    background:var(--paper); border:3px solid var(--line);
    font-size:15px; cursor:pointer;
  }
  .date-stamp{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:11px; letter-spacing:0.04em;
    background:var(--yellow); border:3px solid var(--line);
    padding:6px 10px; margin-bottom:16px; text-transform:uppercase;
  }
  .block{
    background:var(--paper); border:4px solid var(--line); box-shadow:6px 6px 0 var(--line);
    padding:16px; margin-bottom:18px;
  }
  .block textarea{
    width:100%; background:none; border:none; outline:none; color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif; font-size:16px; font-weight:500; line-height:1.6; resize:none;
  }
  .audio-row{display:flex; align-items:center; gap:12px;}
  .reel{
    width:38px; height:38px; border:3px solid var(--line);
    background:var(--teal); flex-shrink:0;
  }
  .fake-audio{flex:1; height:32px; background:var(--bg); border:3px solid var(--line);}
  .add-bar{display:flex; gap:8px; margin-top:22px;}
  .add-btn{
    flex:1; text-align:center; padding:12px 4px; background:var(--paper);
    border:3px solid var(--line); box-shadow:4px 4px 0 var(--line);
    font-family:'IBM Plex Sans', sans-serif; font-weight:700; font-size:10.5px; text-transform:uppercase;
    cursor:pointer; transition:transform .08s, box-shadow .08s;
  }
  .add-btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line);}
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <div class="tab active" data-target="home">HOME</div>
    <div class="tab" data-target="note">NOTE</div>
  </div>

  <div class="view active" id="home">
    <h1 class="brand">Kitaab</h1>
    <div class="section-label">Recent</div>
    <div class="recent-row">
      <div class="tile c1"><div class="t-notebook">Demobook</div><div class="t-title">Pin it</div><div class="t-meta">4m ago</div></div>
      <div class="tile c2"><div class="t-notebook">Demobook</div><div class="t-title">Sample note</div><div class="t-meta">1h ago</div></div>
      <div class="tile c3"><div class="t-notebook">Book2</div><div class="t-title">Chorus idea</div><div class="t-meta">Yesterday</div></div>
    </div>
    <div class="section-label">Notebooks</div>
    <div class="card">
      <div><div class="card-title">Demobook</div><div class="card-meta">2 notes</div></div>
      <div class="badge">Open</div>
    </div>
    <div class="card">
      <div><div class="card-title">Book2</div><div class="card-meta">0 notes</div></div>
      <div class="badge">Open</div>
    </div>
    <div class="fab">+ New notebook</div>
  </div>

  <div class="view" id="note">
    <div class="note-header">
      <div class="note-title">Pin it</div>
      <div class="icon-row">
        <div class="icon-box">★</div>
        <div class="icon-box">🗑</div>
      </div>
    </div>
    <div class="date-stamp">July 13th · 8:21am</div>
    <div class="block">
      <textarea readonly>Verse 1 — walking home under gold streetlight,
feels like the whole city's holding its breath tonight...</textarea>
    </div>
    <div class="block">
      <div class="audio-row">
        <div class="reel"></div>
        <div class="fake-audio"></div>
      </div>
    </div>
    <div class="add-bar">
      <div class="add-btn">Text</div>
      <div class="add-btn">Record</div>
      <div class="add-btn">Photo</div>
      <div class="add-btn">Video</div>
      <div class="add-btn">YT</div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.target).classList.add('active');
    });
  });
</script>
</body>
</html>
